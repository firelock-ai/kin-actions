name: Kin Actions Exact Consumer Pin Wave

# Default-branch-only controller. The dedicated App is intentionally separate
# from the general release App because this job's exact purpose is to edit
# allowlisted `.github/workflows/**` files. Its installation is expected to be
# restricted to exactly `.kin-release/consumers.json`.
on:
  repository_dispatch:
    types: [kin-actions-pin-reconcile]
  schedule:
    - cron: "11 */6 * * *"

permissions:
  contents: read

# A surviving run always reads GitHub Latest and reconciles the complete
# consumer manifest. Replaced pending dispatches therefore cannot lose a
# repository or leave the fleet pinned to an older finalized release.
concurrency:
  group: kin-actions-exact-consumer-pin-wave
  cancel-in-progress: false

jobs:
  pin_wave:
    name: Reconcile immutable workflow pins
    runs-on: ubuntu-latest
    environment: release-followups
    env:
      HAVE_PIN_APP: >-
        ${{ secrets.KIN_WORKFLOW_PIN_APP_ID != '' &&
            secrets.KIN_WORKFLOW_PIN_APP_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require the dedicated workflow-pin App
        run: |
          set -euo pipefail
          if [[ "$HAVE_PIN_APP" != "true" ]]; then
            echo "::error::release-followups must provide KIN_WORKFLOW_PIN_APP_ID and KIN_WORKFLOW_PIN_APP_PRIVATE_KEY"
            exit 1
          fi

      - name: Mint installation token for manifest repositories
        id: pin_app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.KIN_WORKFLOW_PIN_APP_ID }}
          private-key: ${{ secrets.KIN_WORKFLOW_PIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-workflows: write

      - name: Prove exact App installation and permission boundary
        env:
          GH_TOKEN: ${{ steps.pin_app.outputs.token }}
        run: |
          set -euo pipefail
          mapfile -t expected < <(
            python3 -c '
          import json
          data=json.load(open(".kin-release/consumers.json", encoding="utf-8"))
          print(*sorted(data["repositories"]), sep="\n")
          '
          )
          mapfile -t installed < <(
            gh api --paginate installation/repositories \
              --jq '.repositories[].full_name' | sort -u
          )
          if [[ "$(printf '%s\n' "${expected[@]}")" !=
                "$(printf '%s\n' "${installed[@]}")" ]]; then
            echo "::error::workflow-pin App installation must equal the exact consumer manifest"
            diff -u <(printf '%s\n' "${expected[@]}") \
              <(printf '%s\n' "${installed[@]}") || true
            exit 1
          fi

      - name: Resolve latest finalized kin-actions release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ github.event.client_payload.version }}
        run: |
          set -euo pipefail
          release="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/latest"
          )"
          if [[ "$(jq -r .draft <<<"$release")" != "false" ||
                "$(jq -r .prerelease <<<"$release")" != "false" ]]; then
            echo "::error::GitHub Latest is not a finalized stable release"
            exit 1
          fi
          tag="$(jq -r .tag_name <<<"$release")"
          version="${tag#v}"
          if [[ "$tag" != "v${version}" ||
                ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::GitHub Latest tag is not stable vSemVer: $tag"
            exit 1
          fi
          if [[ -n "$REQUESTED_VERSION" ]]; then
            selected="$(
              python3 - "$REQUESTED_VERSION" "$version" <<'PY'
          import re
          import sys
          def parse(raw):
              if not re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", raw):
                  raise SystemExit(f"invalid requested version: {raw}")
              return tuple(map(int, raw.split(".")))
          requested, latest = sys.argv[1:]
          if parse(requested) > parse(latest):
              raise SystemExit(
                  f"requested v{requested} is newer than finalized latest v{latest}"
              )
          print(latest)
          PY
            )"
            version="$selected"
            tag="v${version}"
          fi
          git fetch --no-tags origin "refs/tags/${tag}:refs/tags/${tag}"
          tag_sha="$(git rev-list -n1 "refs/tags/${tag}")"
          tagged_version="$(git show "${tag_sha}:VERSION" | tr -d '[:space:]')"
          if [[ "$tagged_version" != "$version" ]]; then
            echo "::error::${tag} commit carries VERSION=${tagged_version}"
            exit 1
          fi
          # The whole fleet is about to be pinned to this commit, so prove it
          # is one released default-branch commit rather than a tag minted on
          # a side branch. `grep -c` counts without closing the pipe early,
          # which `grep -q` would do under `pipefail`.
          lineage="$(
            git rev-list --first-parent HEAD | grep -cx "$tag_sha" || true
          )"
          if [[ "$lineage" != "1" ]]; then
            echo "::error::${tag} commit ${tag_sha} is not on the default-branch first-parent release lineage"
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "tag_sha=$tag_sha"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Reconcile every exact consumer pin PR
        env:
          GH_TOKEN: ${{ steps.pin_app.outputs.token }}
          TARGET_VERSION: ${{ steps.release.outputs.version }}
          KIN_ACTIONS_ROOT: ${{ github.workspace }}
          PIN_MANIFEST: >-
            ${{ github.workspace }}/.kin-release/consumers.json
        run: |
          set -euo pipefail
          mapfile -t repositories < <(
            python3 -c '
          import json
          data=json.load(open(".kin-release/consumers.json", encoding="utf-8"))
          print(*sorted(data["repositories"]), sep="\n")
          '
          )
          mkdir -p "${RUNNER_TEMP}/kin-actions-pin-wave"
          failures=()
          for repository in "${repositories[@]}"; do
            target="${RUNNER_TEMP}/kin-actions-pin-wave/${repository##*/}"
            if ! gh repo clone "$repository" "$target" -- --filter=blob:none; then
              echo "::error::failed to clone ${repository} for pin reconciliation"
              failures+=("$repository")
              continue
            fi
            if ! (
              cd "$target"
              TARGET_REPOSITORY="$repository" \
                "${KIN_ACTIONS_ROOT}/scripts/reconcile-workflow-pin-pr.sh"
            ); then
              echo "::error::failed to reconcile exact pins in ${repository}"
              failures+=("$repository")
            fi
          done
          if ((${#failures[@]} > 0)); then
            printf 'pin reconciliation failed for: %s\n' "${failures[*]}" >&2
            exit 1
          fi
