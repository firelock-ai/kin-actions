name: Kin Actions Exact Consumer Pin Wave

# Default-branch-only controller. The dedicated App is intentionally separate
# from the general release App because this job's exact purpose is to edit
# allowlisted `.github/workflows/**` files. Its installation is expected to be
# restricted to exactly `.kin-release/consumers.json`.
on:
  repository_dispatch:
    types: [kin-actions-pin-reconcile]
  schedule:
    - cron: "11 */6 * * *"

permissions:
  contents: read

# A surviving run always reads GitHub Latest and reconciles the complete
# consumer manifest. Replaced pending dispatches therefore cannot lose a
# repository or leave the fleet pinned to an older finalized release.
concurrency:
  group: kin-actions-exact-consumer-pin-wave
  cancel-in-progress: false

jobs:
  pin_wave:
    name: Reconcile immutable workflow pins
    runs-on: ubuntu-latest
    environment: release-followups
    env:
      HAVE_PIN_APP: >-
        ${{ secrets.KIN_WORKFLOW_PIN_APP_ID != '' &&
            secrets.KIN_WORKFLOW_PIN_APP_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve latest finalized kin-actions release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ github.event.client_payload.version }}
        run: |
          set -euo pipefail
          release="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/latest"
          )"
          if [[ "$(jq -r .draft <<<"$release")" != "false" ||
                "$(jq -r .prerelease <<<"$release")" != "false" ]]; then
            echo "::error::GitHub Latest is not a finalized stable release"
            exit 1
          fi
          tag="$(jq -r .tag_name <<<"$release")"
          version="${tag#v}"
          if [[ "$tag" != "v${version}" ||
                ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::GitHub Latest tag is not stable vSemVer: $tag"
            exit 1
          fi
          if [[ -n "$REQUESTED_VERSION" ]]; then
            selected="$(
              python3 - "$REQUESTED_VERSION" "$version" <<'PY'
          import re
          import sys
          def parse(raw):
              if not re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", raw):
                  raise SystemExit(f"invalid requested version: {raw}")
              return tuple(map(int, raw.split(".")))
          requested, latest = sys.argv[1:]
          if parse(requested) > parse(latest):
              raise SystemExit(
                  f"requested v{requested} is newer than finalized latest v{latest}"
              )
          print(latest)
          PY
            )"
            version="$selected"
            tag="v${version}"
          fi
          git fetch --no-tags origin "refs/tags/${tag}:refs/tags/${tag}"
          tag_sha="$(git rev-list -n1 "refs/tags/${tag}")"
          tagged_version="$(git show "${tag_sha}:VERSION" | tr -d '[:space:]')"
          if [[ "$tagged_version" != "$version" ]]; then
            echo "::error::${tag} commit carries VERSION=${tagged_version}"
            exit 1
          fi
          # The whole fleet is about to be pinned to this commit, so prove it
          # is one released default-branch commit rather than a tag minted on
          # a side branch. `grep -c` counts without closing the pipe early,
          # which `grep -q` would do under `pipefail`.
          lineage="$(
            git rev-list --first-parent HEAD | grep -cx "$tag_sha" || true
          )"
          if [[ "$lineage" != "1" ]]; then
            echo "::error::${tag} commit ${tag_sha} is not on the default-branch first-parent release lineage"
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "tag_sha=$tag_sha"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout exact finalized rollout controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.release.outputs.tag_sha }}
          path: .kin-actions-release
          persist-credentials: false

      - name: Detect the versioned rollout protocol
        id: protocol
        env:
          TARGET_VERSION: ${{ steps.release.outputs.version }}
          EXPECTED_TAG_SHA: ${{ steps.release.outputs.tag_sha }}
          RELEASE_ROOT: ${{ github.workspace }}/.kin-actions-release
        run: |
          set -euo pipefail
          manifest="${RELEASE_ROOT}/.kin-release/consumers.json"
          runner="${RELEASE_ROOT}/scripts/run-workflow-pin-wave.sh"
          actual_tag_sha="$(git -C "$RELEASE_ROOT" rev-parse HEAD)"
          if [[ "$actual_tag_sha" != "$EXPECTED_TAG_SHA" ]]; then
            echo "::error::released controller checkout is ${actual_tag_sha}, expected ${EXPECTED_TAG_SHA}"
            exit 1
          fi
          protocol_required="$(
            python3 - "$TARGET_VERSION" <<'PY'
          import re
          import sys
          match = re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", sys.argv[1])
          if not match:
              raise SystemExit(f"invalid stable version: {sys.argv[1]}")
          print("true" if tuple(map(int, match.groups())) >= (0, 1, 34) else "false")
          PY
          )"
          if [[ "$protocol_required" != "true" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! -f "$manifest" || -L "$manifest" ||
                ! -f "$runner" || -L "$runner" ||
                "$(jq -r '.schema // 0' "$manifest")" != "2" ]]; then
            echo "::error::v${TARGET_VERSION} must carry the exact schema-2 rollout controller"
            exit 1
          fi
          minimum="$(jq -r '.protocol.minimum_version' "$manifest")"
          if [[ "$minimum" != "0.1.34" ]]; then
            echo "::error::released rollout protocol minimum must remain 0.1.34"
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Require the dedicated workflow-pin App
        if: steps.protocol.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          if [[ "$HAVE_PIN_APP" != "true" ]]; then
            echo "::error::release-followups must provide KIN_WORKFLOW_PIN_APP_ID and KIN_WORKFLOW_PIN_APP_PRIVATE_KEY"
            exit 1
          fi

      - name: Mint installation token for manifest repositories
        if: steps.protocol.outputs.enabled == 'true'
        id: pin_app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.KIN_WORKFLOW_PIN_APP_ID }}
          private-key: ${{ secrets.KIN_WORKFLOW_PIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-workflows: write
          permission-actions: read
          permission-checks: read
          permission-administration: read

      - name: Prove exact App installation and permission boundary
        if: steps.protocol.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ steps.pin_app.outputs.token }}
          RELEASE_MANIFEST: >-
            ${{ github.workspace }}/.kin-actions-release/.kin-release/consumers.json
        run: |
          set -euo pipefail
          mapfile -t expected < <(
            python3 -c '
          import json, os
          data=json.load(open(os.environ["RELEASE_MANIFEST"], encoding="utf-8"))
          print(*sorted(data["repositories"]), sep="\n")
          '
          )
          mapfile -t installed < <(
            gh api --paginate installation/repositories \
              --jq '.repositories[].full_name' | sort -u
          )
          # Inside [[ ]] a bare newline ends the conditional expression, so the
          # operator and its right operand must stay on one logical line.
          if [[ "$(printf '%s\n' "${expected[@]}")" \
                != "$(printf '%s\n' "${installed[@]}")" ]]; then
            echo "::error::workflow-pin App installation must equal the exact release manifest"
            diff -u <(printf '%s\n' "${expected[@]}") \
              <(printf '%s\n' "${installed[@]}") || true
            exit 1
          fi

      # GitHub omits bypass_actors unless the caller can write this ruleset.
      # Giving candidate-owned workflow code that credential would turn a
      # readback guard into mutation authority. Keep rollout fail-closed until
      # a trusted external auditor holds the separately provisioned credential
      # and supplies a proof surface that candidate code can only read.
      - name: Hold for external no-bypass tag-freeze audit
        if: steps.protocol.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          echo "::error::workflow-pin rollout is held for an external ruleset-write audit"
          echo "GitHub hides bypass_actors from read-only ruleset responses."
          echo "Keep the separately provisioned ruleset-write credential outside candidate code."
          echo "Provision an independently managed proof surface before removing this hold."
          exit 1

      - name: Globally preflight and advance one proof-gated consumer
        if: steps.protocol.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ steps.pin_app.outputs.token }}
          TARGET_VERSION: ${{ steps.release.outputs.version }}
          KIN_ACTIONS_ROOT: ${{ github.workspace }}/.kin-actions-release
          PIN_MANIFEST: >-
            ${{ github.workspace }}/.kin-actions-release/.kin-release/consumers.json
        run: |
          set -euo pipefail
          bash "${KIN_ACTIONS_ROOT}/scripts/run-workflow-pin-wave.sh"
