name: Cargo Dependency Wave

on:
  workflow_call:
    inputs:
      manifests:
        required: false
        type: string
        default: Cargo.toml
      test-command:
        required: false
        type: string
        default: cargo test
      watched-crates:
        required: false
        type: string
        default: kin-blobs kin-vector kin-infer kin-search kin-model kin-db kin-lsp kin-vfs-core
      labels:
        # Release-intent metadata applied to every consumer-bump PR. Callers may
        # extend/override; `proof-impacting` is appended automatically (below).
        required: false
        type: string
        default: release:consumer-bump
      proof-impacting-crates:
        # A bump of any crate in this set can move benchmark/proof results, so its
        # PR also carries the `proof-impacting` label for reviewer routing.
        required: false
        type: string
        default: kin-blobs kin-vector kin-infer kin-search kin-model kin-db kin-ranking
      bump-own-version:
        # A dependency-pin change trips the version gate, so the wave bumps the
        # consumer's own patch version by default. Repos whose own version moves
        # through a separate process opt out: kin's release version spans five
        # files in lockstep, so a single-file bump there is a hazard, not help.
        required: false
        type: boolean
        default: true
      version-mode:
        # `train` means the consumer's own release train owns version movement.
        # It therefore requires bump-own-version=false and the release App;
        # mutable workflow labels and the default Actions token have no write
        # authority in that mode.
        required: false
        type: string
        default: manual
      release-environment:
        # Train callers bind App credentials through this protected,
        # default-branch-only environment.
        required: false
        type: string
        default: registry-publish
      refresh-all-on-event:
        # Deprecated compatibility input. Every run now refreshes the complete
        # watched set because GitHub retains only one pending run per
        # concurrency group; event-only refresh can lose a distinct crate
        # release when a newer pending run replaces it.
        required: false
        type: boolean
        default: true
      reviewers:
        # Comma-separated logins to request as reviewers on the bump PR. Gated
        # repos set the founder here so the PR lands in the native GitHub
        # review-requests queue and notifies; auto-merge repos leave it empty,
        # since requesting review on a PR that merges itself is noise. GitHub
        # rejects a request naming the PR author, so leave empty for PRs the
        # same account opens.
        required: false
        type: string
        default: ""
      auto-merge:
        # Arm GitHub auto-merge on the bump PR so it lands the moment every
        # required check passes. Requires allow_auto_merge on the repo. Leaf
        # libraries opt in; gated repos leave this off and merge through an
        # explicit approval instead.
        required: false
        type: boolean
        default: false
      report-only:
        # Dry-run: resolve and report the pins that WOULD change without writing
        # manifests or opening a PR. Lets an operator inspect the dependency graph
        # safely (surface it through a caller's workflow_dispatch input).
        required: false
        type: boolean
        default: false
      kin-actions-ref:
        # Deprecated and ignored. Helper bytes are the exact called-workflow
        # commit from job.workflow_repository/job.workflow_sha.
        required: false
        type: string
        default: ""
    secrets:
      KIN_CI_BOT_TOKEN:
        required: false
      KIN_RELEASE_BOT_APP_ID:
        required: false
      KIN_RELEASE_BOT_PRIVATE_KEY:
        required: false

permissions:
  contents: write
  pull-requests: write

# Repository-dispatch delivery is at-least-once, while GitHub retains only one
# pending run per concurrency group. Every surviving run therefore refreshes
# the complete watched set from strict registry authority. That makes replacement
# of one pending event safe and also lets a later run rebuild the shared
# automation branch while an earlier PR is still unmerged.
concurrency:
  group: kin-dependency-wave-${{ github.repository }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  KINLAB_CARGO_REGISTRY_URL: https://kinlab.ai

jobs:
  dependency_wave:
    name: Update Kin registry dependency pins
    runs-on: ubuntu-latest
    environment: ${{ inputs.release-environment }}
    env:
      HAVE_RELEASE_APP: >-
        ${{ secrets.KIN_RELEASE_BOT_APP_ID != '' &&
            secrets.KIN_RELEASE_BOT_PRIVATE_KEY != '' }}
    steps:
      - name: Enforce automatic train authority
        env:
          VERSION_MODE: ${{ inputs.version-mode }}
          BUMP_OWN_VERSION: ${{ inputs.bump-own-version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          case "$VERSION_MODE" in
            manual|train) ;;
            *)
              echo "::error::version-mode must be manual or train"
              exit 1
              ;;
          esac
          if [[ "$VERSION_MODE" == "train" ]]; then
            if [[ "$BUMP_OWN_VERSION" != "false" ]]; then
              echo "::error::train-mode dependency waves require bump-own-version=false"
              exit 1
            fi
            if [[ "$GITHUB_REF" != "refs/heads/${DEFAULT_BRANCH}" ]]; then
              echo "::error::train-mode dependency waves run only from protected ${DEFAULT_BRANCH}"
              exit 1
            fi
            if [[ "$HAVE_RELEASE_APP" != "true" ]]; then
              echo "::error::${{ inputs.release-environment }} must provide KIN_RELEASE_BOT_APP_ID and KIN_RELEASE_BOT_PRIVATE_KEY"
              exit 1
            fi
          fi

      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .kin-actions
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Mint repository-scoped release token
        id: release_app
        if: env.HAVE_RELEASE_APP == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.KIN_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.KIN_RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: Require the minted App token in train mode
        if: inputs.version-mode == 'train'
        env:
          RELEASE_APP_TOKEN: ${{ steps.release_app.outputs.token }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_APP_TOKEN" ]]; then
            echo "::error::train mode refuses PAT and GITHUB_TOKEN fallback"
            exit 1
          fi
      - name: Configure Kin registry
        run: |
          mkdir -p .cargo
          touch .cargo/config.toml
          if ! grep -q '^\[registries\.kin\]' .cargo/config.toml; then
            cat >> .cargo/config.toml <<'TOML'

          [registries.kin]
          index = "sparse+https://kinlab.ai/registry/cargo/"
          TOML
          fi
      - name: Update Cargo manifests
        id: update
        env:
          EVENT_CRATE: ${{ github.event.client_payload.crate_name }}
          EVENT_VERSION: ${{ github.event.client_payload.crate_version }}
          MANIFESTS: ${{ inputs.manifests }}
          WATCHED: ${{ inputs.watched-crates }}
          PROOF_CRATES: ${{ inputs.proof-impacting-crates }}
          BASE_LABELS: ${{ inputs.labels }}
          REPORT_ONLY: ${{ inputs.report-only }}
        run: |
          args=()
          for m in $MANIFESTS; do args+=(--manifest "$m"); done
          dry=()
          if [[ "$REPORT_ONLY" == "true" ]]; then dry+=(--dry-run); fi
          proof=false
          note_proof() {
            for pc in $PROOF_CRATES; do
              if [[ "$pc" == "$1" ]]; then proof=true; fi
            done
            return 0
          }
          run_update() {
            python3 .kin-actions/scripts/update-cargo-registry-deps.py "$@"
            result=$?
            case "$result" in
              0|2) return "$result" ;;
              *)
                echo "::error::dependency updater failed with exit code $result; aborting without a PR"
                exit "$result"
                ;;
            esac
          }
          title="refresh Kin registry dependency pins"
          crate_args=()
          for crate in $WATCHED; do
            crate_args+=(--crate "$crate")
          done
          if [[ -n "${EVENT_CRATE:-}" && -n "${EVENT_VERSION:-}" ]]; then
            # Preserve an event version that is ahead of a briefly stale index,
            # but never narrow the transaction to that event alone. The updater
            # rejects the event floor if that exact registry row is yanked.
            crate_args+=(
              --crate "$EVENT_CRATE"
              --event-crate "$EVENT_CRATE"
              --version "$EVENT_VERSION"
            )
            title="refresh Kin registry pins after $EVENT_CRATE@$EVENT_VERSION"
          fi
          set +e
          run_update "${crate_args[@]}" "${dry[@]}" "${args[@]}"
          code=$?
          set -e
          if [[ "$code" == "0" ]]; then
            # The updater plans and applies the watched set as one
            # transaction. Conservatively route review if any requested
            # crate is proof-impacting.
            for crate in $WATCHED; do note_proof "$crate"; done
            if [[ -n "${EVENT_CRATE:-}" ]]; then note_proof "$EVENT_CRATE"; fi
          fi
          # report-only never opens a PR, even when pins would change.
          if [[ "$code" == "0" && "$REPORT_ONLY" != "true" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          labels="$BASE_LABELS"
          if [[ "$proof" == "true" ]]; then
            labels="${labels:+$labels,}proof-impacting"
          fi
          echo "labels=$labels" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          if [[ "$REPORT_ONLY" == "true" ]]; then
            echo "::notice::report-only dependency wave: reported pins that would change; no PR opened."
          fi
      - name: Bump own version so the PR can pass the version gate
        if: steps.update.outputs.changed == 'true' && inputs.bump-own-version
        env:
          MANIFESTS: ${{ inputs.manifests }}
        run: |
          set -euo pipefail
          # The gate sets require_bump from dep_manifest_changes alone, so a PR
          # that only moves dependency pins still has to move its own version.
          # Without this the wave opens a PR that fails a gate it triggered.
          #
          # A workspace member manifest can carry `version.workspace = true`
          # (kin-db's does), in which case the crate's own version lives in the
          # ROOT manifest's [workspace.package]. When every listed manifest has
          # no own version to move, bump the root instead of silently skipping.
          handled=0
          for m in $MANIFESTS; do
            out="$(python3 .kin-actions/scripts/bump-own-version.py --manifest "$m")"
            printf '%s\n' "$out"
            case "$out" in *"nothing to bump"*) ;; *) handled=1;; esac
          done
          if [ "$handled" = "0" ] && [ -f Cargo.toml ]; then
            python3 .kin-actions/scripts/bump-own-version.py --manifest Cargo.toml
          fi

      - name: Run verification
        if: steps.update.outputs.changed == 'true'
        run: ${{ inputs.test-command }}
      - name: Clean helper checkout
        if: always()
        run: rm -rf .kin-actions
      - name: Ensure release-intent labels exist
        # Best-effort: GitHub's add-labels API rejects unknown labels, so create
        # them idempotently first. Never block the bump PR on label provisioning.
        if: steps.update.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: >-
            ${{ steps.release_app.outputs.token ||
                secrets.KIN_CI_BOT_TOKEN || github.token }}
          LABELS: ${{ steps.update.outputs.labels }}
        run: |
          IFS=',' read -ra names <<< "$LABELS"
          for raw in "${names[@]}"; do
            name="$(echo "$raw" | xargs)"
            if [[ -z "$name" ]]; then continue; fi
            gh label create "$name" --force \
              --color ededed \
              --description "Kin release automation"
          done
      - name: Open dependency bump PR
        id: open_pr
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: >-
            ${{ steps.release_app.outputs.token ||
                secrets.KIN_CI_BOT_TOKEN || github.token }}
          branch: automation/kin-registry-dependency-wave
          delete-branch: true
          signoff: true
          labels: ${{ steps.update.outputs.labels }}
          # Attribute server-created dependency commits to the automation that
          # creates them. This is truthful provenance, not a timestamp exemption.
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          reviewers: ${{ inputs.reviewers }}
          commit-message: "chore(deps): ${{ steps.update.outputs.title }}"
          title: "chore(deps): ${{ steps.update.outputs.title }}"
          body: |
            Automated Kin registry dependency wave.

            This PR updates Cargo registry dependency pins after a verified Kin registry publish and runs the repo smoke command before opening the PR.

      - name: Arm auto-merge on the bump PR
        if: >-
          inputs.auto-merge && steps.update.outputs.changed == 'true' &&
          steps.open_pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: >-
            ${{ steps.release_app.outputs.token ||
                secrets.KIN_CI_BOT_TOKEN || github.token }}
          PR: ${{ steps.open_pr.outputs.pull-request-number }}
        run: |
          set -euo pipefail
          # --auto defers the merge to GitHub until every required check passes;
          # nothing lands early, and a failed gate leaves the PR open.
          gh pr merge --squash --auto "$PR" --repo "$GITHUB_REPOSITORY"
