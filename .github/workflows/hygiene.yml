name: Hygiene

# Dogfoods the reusable metadata-safety gate on this repo's own PRs and
# unit-tests the scanner. The gate runs against the change's own version of the
# script (kin-actions-ref = the head sha under test), so changes to the scanner
# are proven before they are released for other repos to consume.
on:
  pull_request:
  # Both jobs here produce required contexts, so they must also report on the
  # merge queue's speculative merge commits.
  merge_group:

permissions:
  contents: read

jobs:
  unit:
    name: Hygiene scanner unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

  gate:
    name: Self public-history hygiene
    uses: ./.github/workflows/public-history-hygiene.yml
    with:
      # A merge group carries no pull_request payload; leaving this unresolved
      # would send an empty ref, which suppresses the input default and checks
      # out whatever the scanner repo's default branch happens to be instead of
      # the tree under test.
      kin-actions-ref: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha }}
