name: Hygiene

# Dogfoods the reusable metadata-safety gate on this repo's own PRs and
# unit-tests the scanner. The gate runs against the PR's own version of the
# script (kin-actions-ref = PR head sha), so changes to the scanner are proven
# before they are released for other repos to consume.
on:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Hygiene scanner unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

  gate:
    name: Self public-history hygiene
    uses: ./.github/workflows/public-history-hygiene.yml
    with:
      kin-actions-ref: ${{ github.event.pull_request.head.sha }}
