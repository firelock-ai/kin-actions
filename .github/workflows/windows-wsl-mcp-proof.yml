# Windows and WSL MCP proof for an installed Kin release or an exact candidate.
#
# Installs Kin the way a user does, with npx or from an archive, on a fresh
# GitHub-hosted Windows runner. Then it drives the installed `kin mcp start`
# with the official MCP SDK client: initialize, tools/list, and a
# find_references call on a fixture whose answer is known by construction.
# Native Windows and WSL2 are separate jobs.
#
# The archive is a published release asset by default. A dispatch can name an
# exact candidate archive instead, by anonymous https URL and the sha256 its
# bytes must match, so a candidate is proven without publishing a release.
#
# Each leg writes a receipt that grades four levels separately: install,
# config written, MCP handshake, real tool answer. The client is the official
# MCP SDK client, not the Claude Code app, and "config written" means kin setup
# wrote Claude Code's config file, not that the Claude Code app ran.
# proof/README.md has the exact wording and what none of the levels prove.
#
# Public repository and GitHub-hosted runners, so it costs nothing. No secrets,
# a read-only token, no private checkout, and no trigger that runs code from a
# pull request. Only built archives come in, and they never leave as artifacts.

name: Windows and WSL MCP proof

on:
  push:
    branches: [ci/windows-wsl-mcp-proof]
  workflow_dispatch:
    inputs:
      kin_version:
        description: Version the binaries must report, without the leading v. Blank uses proof/target.env; required with a candidate archive.
        required: false
        type: string
      windows_archive_url:
        description: Optional exact Windows x86_64 candidate archive (.zip or .tar.gz). Anonymous https only, no query string.
        required: false
        type: string
      windows_archive_sha256:
        description: The sha256 the Windows archive's bytes must match. Required with windows_archive_url.
        required: false
        type: string
      linux_archive_url:
        description: Optional exact Linux x86_64 candidate archive (.tar.gz) for the WSL2 legs. Anonymous https only, no query string.
        required: false
        type: string
      linux_archive_sha256:
        description: The sha256 the Linux archive's bytes must match. Required with linux_archive_url.
        required: false
        type: string
      setup_contract_expect:
        description: Which kin setup client-failure behaviour the Windows contract job grades. fixed for a build with the fix, old for a build before it.
        required: false
        type: choice
        default: fixed
        options: [fixed, old]

permissions:
  contents: read

concurrency:
  group: windows-wsl-mcp-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve the bytes under proof
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.pick.outputs.version }}
      tag: ${{ steps.pick.outputs.tag }}
      source_kind: ${{ steps.pick.outputs.source_kind }}
      windows_url: ${{ steps.pick.outputs.windows_url }}
      windows_sha256: ${{ steps.pick.outputs.windows_sha256 }}
      linux_url: ${{ steps.pick.outputs.linux_url }}
      linux_sha256: ${{ steps.pick.outputs.linux_sha256 }}
      windows_modes: ${{ steps.pick.outputs.windows_modes }}
      wsl_modes: ${{ steps.pick.outputs.wsl_modes }}
      setup_expect: ${{ steps.pick.outputs.setup_expect }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pick the version and the archive source
        id: pick
        env:
          INPUT_VERSION: ${{ inputs.kin_version }}
          WIN_URL: ${{ inputs.windows_archive_url }}
          WIN_SHA: ${{ inputs.windows_archive_sha256 }}
          LNX_URL: ${{ inputs.linux_archive_url }}
          LNX_SHA: ${{ inputs.linux_archive_sha256 }}
          INPUT_SETUP_EXPECT: ${{ inputs.setup_contract_expect }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*" >&2; exit 1; }

          kind=release
          if [ -n "${WIN_URL}${WIN_SHA}${LNX_URL}${LNX_SHA}" ]; then kind=artifact; fi

          version="${INPUT_VERSION:-}"
          if [ -z "$version" ]; then
            [ "$kind" = release ] || fail "a candidate archive needs kin_version, the version its binaries must report"
            version="$(sed -n 's/^KIN_VERSION=//p' proof/target.env | tr -d '[:space:]')"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || fail "'$version' is not a Kin version"
          tag="v$version"

          # A candidate URL must be fetchable by anyone, because this is a public
          # runner holding no credential. Refusing userinfo, query strings and
          # fragments keeps a signed or tokened URL out of a public log.
          check_artifact() {
            local name="$1" url="$2" sha="$3" pattern="$4"
            [ -n "$url" ] || [ -n "$sha" ] || return 0
            [ -n "$url" ] && [ -n "$sha" ] || fail "$name: a candidate archive URL and its sha256 go together"
            [[ "$url" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?/[^?#@[:space:]]+$ ]] \
              || fail "$name: the URL must be anonymous https with no credentials, query string or fragment"
            [[ "$url" =~ $pattern ]] || fail "$name: $url is not a supported archive name"
            [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || fail "$name: sha256 must be 64 hex characters"
            curl -fsSIL --retry 3 -o /dev/null "$url" \
              || fail "$name: $url is not reachable without a credential"
          }

          if [ "$kind" = artifact ]; then
            win_url="$WIN_URL"; win_sha="$(printf '%s' "$WIN_SHA" | tr 'A-F' 'a-f')"
            lnx_url="$LNX_URL"; lnx_sha="$(printf '%s' "$LNX_SHA" | tr 'A-F' 'a-f')"
            check_artifact windows "$win_url" "$win_sha" '\.(zip|tar\.gz)$'
            check_artifact linux "$lnx_url" "$lnx_sha" '\.tar\.gz$'
          else
            base="https://github.com/firelock-ai/kin/releases/download/$tag"
            for asset in kin-windows-x86_64.zip kin-linux-x86_64.tar.gz; do
              curl -fsSIL --retry 3 -o /dev/null "$base/$asset" \
                || fail "$tag has no published $asset, so there are no bytes to prove"
            done
            win_url="$base/kin-windows-x86_64.zip"
            lnx_url="$base/kin-linux-x86_64.tar.gz"
            win_sha="$(curl -fsSL --retry 3 "$win_url.sha256" | awk '{print $1}')"
            lnx_sha="$(curl -fsSL --retry 3 "$lnx_url.sha256" | awk '{print $1}')"
            [[ "$win_sha" =~ ^[0-9a-f]{64}$ && "$lnx_sha" =~ ^[0-9a-f]{64}$ ]] \
              || fail "$tag's .sha256 sidecars did not read as sha256 values"
          fi

          # npx runs only once npm carries the version; until then the archive
          # legs run alone rather than failing on a package that is not out yet.
          npx_mode=""
          if npm view "@kinlab/kin@$version" version >/dev/null 2>&1; then
            npx_mode=npx
          else
            echo "::notice::@kinlab/kin@$version is not on npm yet; the npx legs join once it is"
          fi
          # A dispatch says which setup behaviour to grade; a push reads it from
          # target.env beside the version it names.
          setup_expect="${INPUT_SETUP_EXPECT:-}"
          if [ -z "$setup_expect" ]; then
            setup_expect="$(sed -n 's/^SETUP_CONTRACT_EXPECT=//p' proof/target.env | tr -d '[:space:]')"
          fi
          case "${setup_expect:-fixed}" in
            fixed|old) setup_expect="${setup_expect:-fixed}" ;;
            *) fail "setup contract expectation '$setup_expect' is neither fixed nor old" ;;
          esac

          modes() { printf '%s\n' "$@" | sed '/^$/d' | jq -R . | jq -cs .; }
          windows_modes="$(modes "$npx_mode" "${win_url:+archive}")"
          wsl_modes="$(modes "$npx_mode" "${lnx_url:+archive}")"

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "source_kind=$kind"
            echo "windows_url=$win_url"
            echo "windows_sha256=$win_sha"
            echo "linux_url=$lnx_url"
            echo "linux_sha256=$lnx_sha"
            echo "windows_modes=$windows_modes"
            echo "wsl_modes=$wsl_modes"
            echo "setup_expect=$setup_expect"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Kin $version, archive source: $kind"
            echo
            echo "| platform | archive | expected sha256 | legs |"
            echo "|---|---|---|---|"
            echo "| Windows x86_64 | ${win_url:-none} | ${win_sha:-n/a} | $windows_modes |"
            echo "| WSL2 Linux x86_64 | ${lnx_url:-none} | ${lnx_sha:-n/a} | $wsl_modes |"
            echo
            echo "Windows kin setup client-failure contract graded as: \`$setup_expect\`."
            if [ "$kind" = release ]; then
              echo
              echo "Tag commit: \`$(git ls-remote https://github.com/firelock-ai/kin.git "refs/tags/$tag" "refs/tags/$tag^{}" | sort -k2 | tail -n 1 | awk '{print $1}')\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  windows-native:
    name: Native Windows (${{ matrix.install }})
    needs: resolve
    if: needs.resolve.outputs.windows_modes != '[]'
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        install: ${{ fromJSON(needs.resolve.outputs.windows_modes) }}
    env:
      PROOF_KIN_VERSION: ${{ needs.resolve.outputs.version }}
      INSTALL_MODE: ${{ matrix.install }}
      SOURCE_KIND: ${{ needs.resolve.outputs.source_kind }}
      REF_URL: ${{ needs.resolve.outputs.windows_url }}
      REF_SHA256: ${{ needs.resolve.outputs.windows_sha256 }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install the proof client
        working-directory: proof
        run: npm ci --no-audit --no-fund

      - name: Record the runner
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path receipts | Out-Null
          $os = Get-CimInstance Win32_OperatingSystem
          [ordered]@{
            caption = $os.Caption; version = $os.Version; build = $os.BuildNumber
            image = "$env:ImageOS $env:ImageVersion"; arch = $env:PROCESSOR_ARCHITECTURE
          } | ConvertTo-Json | Tee-Object -FilePath "$env:RUNNER_TEMP\runner.json"

      # The archive leg installs the reference archive the way its INSTALL.md
      # says, but only after its bytes match the expected sha256. The npx leg
      # installs from npm and compares what it provisioned against the same
      # archive, so the receipt says whether both paths ran the same bytes.
      - name: Install Kin (${{ matrix.install }})
        run: bash proof/install-windows.sh

      # Kin commands run with their output redirected to files, never piped: a
      # daemon started by a command inherits its handles, and a pipe it holds
      # keeps the step waiting until the daemon idles out. Their exit statuses
      # go to files the client grades, so a failure here still yields a receipt.
      - name: Create the fixture repository and admit it with kin init
        run: |
          set -uo pipefail
          T="$(cygpath -u "$RUNNER_TEMP")"
          # The documented native Windows step: Kin admits only a worktree whose
          # bytes match the committed tree.
          git config --global core.autocrlf false
          node proof/make-fixture.mjs "$(cygpath -w "$T/kin-fixture")" | tee "$T/fixture.json"
          cd "$T/kin-fixture"
          status=0
          kin init > "$T/kin-init.txt" 2>&1 < /dev/null || status=$?
          echo "$status" > "$T/kin-init.status"
          cat "$T/kin-init.txt"
          echo "kin init exited $status"

      - name: Write Claude Code's MCP config file with kin setup
        run: |
          set -uo pipefail
          T="$(cygpath -u "$RUNNER_TEMP")"
          # Claude Code keeps ~/.claude/settings.json, and kin setup detects
          # Claude Code from it. The Claude Code app is not installed and never
          # runs here; only the config file setup writes is under test.
          mkdir -p "$HOME/.claude"
          [ -f "$HOME/.claude/settings.json" ] || printf '{}\n' > "$HOME/.claude/settings.json"
          cd "$T/kin-fixture"
          status=0
          kin setup --no-interactive --intent agent --shell powershell > "$T/kin-setup.txt" 2>&1 < /dev/null || status=$?
          echo "$status" > "$T/kin-setup.status"
          cat "$T/kin-setup.txt"
          echo "kin setup exited $status"
          kin setup status --json > "$T/kin-setup-status.json" 2>&1 < /dev/null || true
          cat "$T/kin-setup-status.json"
          cat "$HOME/.claude.json" || echo "no ~/.claude.json was written"

      - name: Drive the installed kin mcp with the official MCP SDK client
        run: |
          set -euo pipefail
          T="$(cygpath -u "$RUNNER_TEMP")"
          node proof/mcp-proof.mjs \
            --leg windows-native --install-mode "$INSTALL_MODE" --kin-version "$PROOF_KIN_VERSION" \
            --repo "$(cygpath -w "$T/kin-fixture")" \
            --launch config --config "$(cygpath -w "$HOME/.claude.json")" \
            --binary "$(cygpath -w "$HOME/.kin/bin/kin.exe")" \
            --install-json "$(cygpath -w "$T/install.json")" \
            --init-status "$(cygpath -w "$T/kin-init.status")" \
            --setup-status "$(cygpath -w "$T/kin-setup.status")" \
            --out "receipts/windows-native-$INSTALL_MODE.json"

      - name: Stop the fixture's daemons and keep the captures
        if: always()
        run: |
          T="$(cygpath -u "$RUNNER_TEMP")"
          kin daemon stop --all --json > "$T/kin-daemon-stop.json" 2>&1 < /dev/null || true
          dest="receipts/captures-windows-native-$INSTALL_MODE"
          mkdir -p "$dest"
          for f in runner.json install.json fixture.json kin-init.txt kin-setup.txt kin-setup-status.json kin-daemon-stop.json kin-install/npx-version.txt; do
            if [ -f "$T/$f" ]; then cp "$T/$f" "$dest/"; fi
          done
          if [ -f "$HOME/.claude.json" ]; then cp "$HOME/.claude.json" "$dest/claude.json"; fi
          node proof/summarize.mjs receipts/*.json >> "$GITHUB_STEP_SUMMARY" || true

      # Receipts and captures only. The archive under test is never uploaded.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: receipt-windows-native-${{ matrix.install }}
          path: receipts/
          retention-days: 30

  # Graded apart from the MCP handshake. kin setup must not report success for
  # a detected client it could not configure: this job runs setup against the
  # real profile root with nothing holding it, with a shell sitting in it, with
  # an unmergeable Claude Code config, and with the folder held exclusively,
  # and grades exit status, the message, and whether the existing config
  # survived. The Claude Code app is not installed; only the config file kin
  # setup writes is under test. proof/setup-contract.ps1 has the cases.
  windows-setup-contract:
    name: Native Windows kin setup client-failure contract (${{ needs.resolve.outputs.setup_expect }})
    needs: resolve
    if: needs.resolve.outputs.windows_url != ''
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PROOF_KIN_VERSION: ${{ needs.resolve.outputs.version }}
      INSTALL_MODE: archive
      SOURCE_KIND: ${{ needs.resolve.outputs.source_kind }}
      REF_URL: ${{ needs.resolve.outputs.windows_url }}
      REF_SHA256: ${{ needs.resolve.outputs.windows_sha256 }}
      SETUP_EXPECT: ${{ needs.resolve.outputs.setup_expect }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install Kin (archive)
        run: bash proof/install-windows.sh
      - name: Grade kin setup against a held and a broken Claude Code config
        shell: pwsh
        run: |
          ./proof/setup-contract.ps1 `
            -Kin "$env:USERPROFILE\.kin\bin\kin.exe" -KinVersion $env:PROOF_KIN_VERSION -Expect $env:SETUP_EXPECT `
            -Out receipts/windows-setup-contract.json -Captures receipts/captures-windows-setup-contract `
            -InstallJson "$env:RUNNER_TEMP\install.json"
      - name: Summarize
        if: always()
        run: node proof/summarize.mjs receipts/*.json >> "$GITHUB_STEP_SUMMARY" || true
      # Receipts and captures only. The archive under test is never uploaded.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: receipt-windows-setup-contract
          path: receipts/
          retention-days: 30

  wsl:
    name: WSL2 Ubuntu 24.04 (${{ matrix.install }})
    needs: resolve
    if: needs.resolve.outputs.wsl_modes != '[]'
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        install: ${{ fromJSON(needs.resolve.outputs.wsl_modes) }}
    env:
      PROOF_KIN_VERSION: ${{ needs.resolve.outputs.version }}
      INSTALL_MODE: ${{ matrix.install }}
      SOURCE_KIND: ${{ needs.resolve.outputs.source_kind }}
      REF_URL: ${{ needs.resolve.outputs.linux_url }}
      REF_SHA256: ${{ needs.resolve.outputs.linux_sha256 }}
      WSL_DISTRO: Ubuntu-24.04
      WSL_USER: kinuser
      # Node inside WSL, verified against nodejs.org's own SHASUMS256.txt. The
      # docs ask for Node 20 or newer inside WSL2 for the npx path.
      NODE_VERSION: v22.23.2
      # wsl.exe forwards only what WSLENV names; /p translates a Windows path.
      # The PROOF_ prefix keeps these out of Kin's own KIN_* namespace.
      WSLENV: PROOF_KIN_VERSION:INSTALL_MODE:SOURCE_KIND:REF_URL:REF_SHA256:NODE_VERSION:GITHUB_WORKSPACE/p
    defaults:
      run:
        shell: wsl-bash {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install the proof client for the Windows-side leg
        shell: bash
        working-directory: proof
        run: |
          npm ci --no-audit --no-fund
          mkdir -p ../receipts

      - uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7.0.0
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          wsl-shell-user: kinuser
          additional-packages: ca-certificates curl git xz-utils

      - name: Record WSL from the Windows side
        shell: pwsh
        run: |
          $env:WSL_UTF8 = '1'
          wsl.exe --version
          wsl.exe --list --verbose
          $os = Get-CimInstance Win32_OperatingSystem
          "$($os.Caption) $($os.Version) image $env:ImageOS $env:ImageVersion"

      # Receipts are written in the WSL home and copied out by root at the end,
      # so this job never depends on how the Windows drive is mounted.
      - name: Record WSL from the inside
        run: |
          set -euo pipefail
          mkdir -p "$HOME/receipts/captures-wsl2-$INSTALL_MODE"
          {
            echo "uname: $(uname -a)"
            echo "proc_version: $(cat /proc/version)"
            grep -E '^(PRETTY_NAME|VERSION_ID)=' /etc/os-release
            echo "user: $(id -un) home: $HOME"
          } | tee "$HOME/receipts/captures-wsl2-$INSTALL_MODE/wsl.txt"
          # WSL2 runs a real Linux kernel whose version string says WSL2; WSL1
          # translates syscalls and does not. Refuse to call a WSL1 run WSL2.
          if ! grep -q 'WSL2' /proc/version; then
            echo "::error::this distribution is not running under WSL2" >&2
            exit 1
          fi

      - name: Install Node inside WSL
        run: |
          set -euo pipefail
          cd /tmp
          file="node-$NODE_VERSION-linux-x64.tar.xz"
          curl -fsSL --retry 3 -o "$file" "https://nodejs.org/dist/$NODE_VERSION/$file"
          curl -fsSL --retry 3 -o SHASUMS256.txt "https://nodejs.org/dist/$NODE_VERSION/SHASUMS256.txt"
          grep " $file\$" SHASUMS256.txt | sha256sum -c -
          mkdir -p "$HOME/.local/node"
          tar -xJf "$file" -C "$HOME/.local/node" --strip-components=1
          printf 'export PATH="%s/.kin/bin:%s/.local/node/bin:$PATH"\n' "$HOME" "$HOME" > "$HOME/proof-env.sh"
          . "$HOME/proof-env.sh"
          node --version

      - name: Install the proof client inside WSL
        run: |
          set -euo pipefail
          . "$HOME/proof-env.sh"
          mkdir -p "$HOME/proof"
          cp "$GITHUB_WORKSPACE"/proof/*.mjs "$GITHUB_WORKSPACE"/proof/*.sh "$GITHUB_WORKSPACE/proof/package.json" "$GITHUB_WORKSPACE/proof/package-lock.json" "$HOME/proof/"
          cd "$HOME/proof"
          npm ci --no-audit --no-fund

      - name: Install Kin inside WSL (${{ matrix.install }})
        run: |
          set -euo pipefail
          . "$HOME/proof-env.sh"
          bash "$HOME/proof/install-linux.sh"

      # On the WSL ext4 filesystem, as the docs direct, not under /mnt/c.
      - name: Create the fixture repository and admit it with kin init
        run: |
          set -uo pipefail
          . "$HOME/proof-env.sh"
          node "$HOME/proof/make-fixture.mjs" "$HOME/kin-fixture" | tee "$HOME/fixture.json"
          cd "$HOME/kin-fixture"
          status=0
          kin init > "$HOME/kin-init.txt" 2>&1 < /dev/null || status=$?
          echo "$status" > "$HOME/kin-init.status"
          cat "$HOME/kin-init.txt"
          echo "kin init exited $status"

      - name: Write Claude Code's MCP config file with kin setup
        run: |
          set -uo pipefail
          . "$HOME/proof-env.sh"
          # Claude Code is detected from a seeded settings file; the app is not
          # installed and never runs here.
          mkdir -p "$HOME/.claude"
          [ -f "$HOME/.claude/settings.json" ] || printf '{}\n' > "$HOME/.claude/settings.json"
          cd "$HOME/kin-fixture"
          status=0
          kin setup --no-interactive --intent agent --shell bash > "$HOME/kin-setup.txt" 2>&1 < /dev/null || status=$?
          echo "$status" > "$HOME/kin-setup.status"
          cat "$HOME/kin-setup.txt"
          echo "kin setup exited $status"
          kin setup status --json > "$HOME/kin-setup-status.json" 2>&1 < /dev/null || true
          cat "$HOME/kin-setup-status.json"
          cat "$HOME/.claude.json" || echo "no ~/.claude.json was written"

      - name: Drive the installed kin mcp from the official MCP SDK client inside WSL
        run: |
          set -euo pipefail
          . "$HOME/proof-env.sh"
          node "$HOME/proof/mcp-proof.mjs" \
            --leg wsl2 --install-mode "$INSTALL_MODE" --kin-version "$PROOF_KIN_VERSION" \
            --repo "$HOME/kin-fixture" \
            --launch config --config "$HOME/.claude.json" \
            --binary "$HOME/.kin/bin/kin" \
            --install-json "$HOME/install.json" \
            --init-status "$HOME/kin-init.status" \
            --setup-status "$HOME/kin-setup.status" \
            --out "$HOME/receipts/wsl2-$INSTALL_MODE.json"

      # A Windows-side agent reaching Kin inside WSL starts it through wsl.exe.
      # The docs do not describe this path, so it is recorded on its own and
      # does not decide the job. The client is still the official MCP SDK client.
      - name: Drive kin mcp inside WSL from a Windows-side client through wsl.exe
        shell: pwsh
        continue-on-error: true
        run: |
          $homeInWsl = "/home/$env:WSL_USER"
          $launch = @('-d', $env:WSL_DISTRO, '-u', $env:WSL_USER, '--cd', "$homeInWsl/kin-fixture", '--', "$homeInWsl/.kin/bin/kin", 'mcp', 'start')
          $version = @('wsl.exe', '-d', $env:WSL_DISTRO, '-u', $env:WSL_USER, '--', "$homeInWsl/.kin/bin/kin", '--version')
          ConvertTo-Json -InputObject $launch -Compress | Set-Content -Encoding utf8NoBOM "$env:RUNNER_TEMP\launch.json"
          ConvertTo-Json -InputObject $version -Compress | Set-Content -Encoding utf8NoBOM "$env:RUNNER_TEMP\version.json"
          node proof/mcp-proof.mjs `
            --leg windows-client-to-wsl2 --install-mode $env:INSTALL_MODE --kin-version $env:PROOF_KIN_VERSION `
            --repo $env:GITHUB_WORKSPACE `
            --launch explicit --command wsl.exe --args-json "@$env:RUNNER_TEMP\launch.json" `
            --version-command-json "@$env:RUNNER_TEMP\version.json" `
            --out "receipts/windows-client-to-wsl2-$env:INSTALL_MODE.json"
          exit $LASTEXITCODE

      - name: Stop the fixture's daemons
        if: always()
        run: |
          . "$HOME/proof-env.sh" || true
          kin daemon stop --all --json > "$HOME/kin-daemon-stop.json" 2>&1 < /dev/null || true
          cat "$HOME/kin-daemon-stop.json" || true

      - name: Copy the receipts out of WSL
        if: always()
        shell: wsl-bash -u root {0}
        run: |
          src="/home/kinuser"
          dest="$GITHUB_WORKSPACE/receipts"
          mkdir -p "$dest/captures-wsl2-$INSTALL_MODE"
          cp -r "$src/receipts/." "$dest/" || true
          for f in install.json fixture.json kin-init.txt kin-setup.txt kin-setup-status.json kin-daemon-stop.json kin-install/npx-version.txt .claude.json; do
            if [ -f "$src/$f" ]; then cp "$src/$f" "$dest/captures-wsl2-$INSTALL_MODE/$(basename "$f" | sed 's/^\.//')"; fi
          done
          ls -la "$dest" "$dest/captures-wsl2-$INSTALL_MODE"

      - name: Summarize
        if: always()
        shell: bash
        run: node proof/summarize.mjs receipts/*.json >> "$GITHUB_STEP_SUMMARY" || true

      # Receipts and captures only. The archive under test is never uploaded.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: receipt-wsl2-${{ matrix.install }}
          path: receipts/
          retention-days: 30
