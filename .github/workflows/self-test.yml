name: Self Test

# Unit-tests the reusable release/CI scripts in this repo so the shared gates
# (version-bump gate) cannot silently regress.
on:
  pull_request:
  push:
    branches: [main]
  # The required `Script unit tests` context has to report on the merge queue's
  # speculative merge commits too, or an enabled queue waits on a check that
  # never arrives. Every step here is event-independent and runs unchanged.
  merge_group:

permissions:
  contents: read

jobs:
  python-unit:
    name: Script unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      # A context used where GitHub does not expose it fails the whole workflow
      # at load time, before any job runs and with no job log. Catch it here
      # instead of in a consumer's release run.
      - name: Check workflow context availability
        run: python3 scripts/check-workflow-contexts.py .github/workflows

      # kin-actions-ref defaults pin which helper-script tree callers check
      # out; a release that bumps VERSION without them ships workflows calling
      # scripts that do not exist at the pinned tag.
      - name: Check helper-ref lockstep with VERSION
        run: python3 scripts/check-ref-lockstep.py
