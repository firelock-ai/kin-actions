name: Cargo Registry Release

on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
      manifest:
        required: false
        type: string
        default: Cargo.toml
      test-command:
        required: false
        type: string
        default: cargo test
      registry-build-command:
        required: false
        type: string
        default: ""
      source-paths:
        # Extra release-source path prefixes for non-standard layouts only.
        # Standard trees (src/, crates/**/src/, packages/**/src/, build.rs) and
        # Cargo.toml dependency/feature changes are detected automatically; docs,
        # tests, examples and CI config never require a bump. Leave empty unless
        # a repo keeps shippable code outside the conventional locations.
        required: false
        type: string
        default: ""
      downstream-manifest:
        required: false
        type: string
        default: .kin-release/downstreams.json
      publish-environment:
        required: false
        type: string
        default: registry-publish
      mint-release-tag:
        # Mint `v<version>` after a successful main publish so the repo's
        # release.yml fires without a human tagging by hand. Off by default so
        # adopting it is a deliberate per-repo choice: a repo with no release.yml
        # gains only a tag, and a repo with its own tag authority (kin) must not
        # be double-tagged.
        required: false
        type: boolean
        default: false
      kin-actions-ref:
        # Default to the tag this workflow ships in so the checked-out helper
        # scripts always match the workflow contract (the version gate forwards
        # --labels, which older scripts reject). Bump in lockstep with releases.
        required: false
        type: string
        default: v0.1.12
    secrets:
      KINLAB_CARGO_TOKEN:
        required: false
      KIN_CI_BOT_TOKEN:
        required: false
      KIN_DOWNSTREAM_DISPATCH_TOKEN:
        required: false
      KIN_RELEASE_TAG_TOKEN:
        # Fallback when no App credentials are supplied. Needs contents:write on
        # the calling repo. A tag pushed with the default GITHUB_TOKEN cannot
        # start release.yml, so mint-release-tag refuses rather than consume the
        # version with a tag that releases nothing.
        required: false
      KIN_RELEASE_BOT_APP_ID:
        # Preferred over a PAT: an App installation token is short-lived, scoped
        # to this repo for the run, and does start release.yml. Same App the kin
        # release flow already mints tags with.
        required: false
      KIN_RELEASE_BOT_PRIVATE_KEY:
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  KINLAB_CARGO_REGISTRY_URL: https://kinlab.ai

jobs:
  version_gate:
    name: Version bump gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          repository: firelock-ai/kin-actions
          ref: ${{ inputs.kin-actions-ref }}
          path: .kin-actions
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Check version movement
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          # Untrusted PR labels are passed via env (never interpolated into the
          # shell) and forwarded to the gate as a single quoted argv value. A
          # `release` / `release:*` label forces the bump requirement.
          PR_LABELS: ${{ github.event_name == 'pull_request' && join(github.event.pull_request.labels.*.name, ',') || '' }}
          SOURCE_PATHS: ${{ inputs.source-paths }}
        run: |
          args=()
          for p in $SOURCE_PATHS; do args+=(--source-path "$p"); done
          python3 .kin-actions/scripts/check-version-bump.py \
            --package "${{ inputs.package }}" \
            --manifest "${{ inputs.manifest }}" \
            --labels "$PR_LABELS" \
            "${args[@]}"

  registry_smoke:
    name: Registry-only build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Force registry-only Kin config
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [registries.kin]
          index = "sparse+https://kinlab.ai/registry/cargo/"
          EOF
      - name: Build without local patches
        env:
          REGISTRY_BUILD_COMMAND: ${{ inputs.registry-build-command }}
        run: |
          if [[ -n "$REGISTRY_BUILD_COMMAND" ]]; then
            eval "$REGISTRY_BUILD_COMMAND"
          else
            cargo build -p "${{ inputs.package }}"
          fi

  test:
    name: Repo verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Run verification
        run: ${{ inputs.test-command }}

  publish:
    name: Publish to Kin registry
    needs: [version_gate, registry_smoke, test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    environment: ${{ inputs.publish-environment }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: firelock-ai/kin-actions
          ref: ${{ inputs.kin-actions-ref }}
          path: .kin-actions
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Resolve version
        id: version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; p="${{ inputs.package }}"; print(next(x["version"] for x in json.load(sys.stdin)["packages"] if x["name"] == p))')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publish
        env:
          PACKAGE: ${{ inputs.package }}
          KINLAB_CARGO_TOKEN: ${{ secrets.KINLAB_CARGO_TOKEN }}
        run: bash .kin-actions/scripts/publish-crate.sh

  consumer_smoke:
    name: Fresh consumer smoke
    needs: publish
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: firelock-ai/kin-actions
          ref: ${{ inputs.kin-actions-ref }}
          path: .kin-actions
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Build exact published version from registry
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: bash .kin-actions/scripts/consumer-smoke.sh

  mint_release_tag:
    name: Mint release tag
    needs: [publish, consumer_smoke]
    # Main pushes only. Gating off a tag push matters: this job's own tag would
    # re-enter this workflow, and it must not tag a tag.
    if: inputs.mint-release-tag && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      # The `secrets` context is not available in an `if:` condition, so presence
      # is resolved here into `env`, which `if:` can read. Interpolating secrets
      # directly into a step `if:` makes GitHub reject the whole workflow file.
      HAVE_APP_CREDS: ${{ secrets.KIN_RELEASE_BOT_APP_ID != '' && secrets.KIN_RELEASE_BOT_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          repository: firelock-ai/kin-actions
          ref: ${{ inputs.kin-actions-ref }}
          path: .kin-actions
      - name: Mint an App installation token
        id: app_token
        if: env.HAVE_APP_CREDS == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.KIN_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.KIN_RELEASE_BOT_PRIVATE_KEY }}
      - name: Mint v<version> when absent
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          # App token first: short-lived and correctly scoped. The PAT chain is
          # the fallback for repos with no App credentials. KIN_DOWNSTREAM_DISPATCH_TOKEN
          # is deliberately NOT consulted: it carries repository_dispatch only,
          # and a push with it fails, which reads as a broken release rather than
          # a missing credential.
          KIN_RELEASE_TAG_TOKEN: ${{ steps.app_token.outputs.token || secrets.KIN_RELEASE_TAG_TOKEN }}
          KIN_CI_BOT_TOKEN: ${{ secrets.KIN_CI_BOT_TOKEN }}
        run: bash .kin-actions/scripts/mint-release-tag.sh

  dispatch_downstreams:
    name: Notify downstream repos
    needs: [publish, consumer_smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: firelock-ai/kin-actions
          ref: ${{ inputs.kin-actions-ref }}
          path: .kin-actions
      - name: Dispatch dependency wave
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ needs.publish.outputs.version }}
          DOWNSTREAM_MANIFEST: ${{ inputs.downstream-manifest }}
          KIN_CI_BOT_TOKEN: ${{ secrets.KIN_CI_BOT_TOKEN }}
          KIN_DOWNSTREAM_DISPATCH_TOKEN: ${{ secrets.KIN_DOWNSTREAM_DISPATCH_TOKEN }}
        run: bash .kin-actions/scripts/dispatch-downstreams.sh
