name: Cargo Registry Release

on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
      manifest:
        required: false
        type: string
        default: Cargo.toml
      test-command:
        required: false
        type: string
        default: cargo test
      registry-build-command:
        required: false
        type: string
        default: ""
      source-paths:
        # Extra release-source path prefixes for non-standard layouts only.
        # Standard trees (src/, crates/**/src/, packages/**/src/, build.rs) and
        # Cargo.toml dependency/feature changes are detected automatically; docs,
        # tests, examples and CI config never require a bump. Leave empty unless
        # a repo keeps shippable code outside the conventional locations.
        required: false
        type: string
        default: ""
      version-mode:
        # `manual` preserves the existing contributor-owned version gate.
        # `train` reserves version movement for the exact generated train PR
        # and lets ordinary source PRs merge without hand-editing Cargo.toml.
        required: false
        type: string
        default: manual
      train-branch:
        required: false
        type: string
        default: automation/release-next
      downstream-manifest:
        required: false
        type: string
        default: .kin-release/downstreams.json
      publish-environment:
        required: false
        type: string
        default: registry-publish
      mint-release-tag:
        # Mint `v<version>` after a successful main publish so the repo's
        # release.yml fires without a human tagging by hand. Off by default so
        # adopting it is a deliberate per-repo choice: a repo with no release.yml
        # gains only a tag, and a repo with its own tag authority (kin) must not
        # be double-tagged.
        required: false
        type: boolean
        default: false
      kin-actions-ref:
        # Deprecated compatibility input. Helper bytes are bound to the exact
        # repository and commit that defined this called workflow via
        # job.workflow_repository/job.workflow_sha; this value is ignored.
        required: false
        type: string
        default: ""
    secrets:
      KINLAB_CARGO_TOKEN:
        required: false
      KIN_CI_BOT_TOKEN:
        required: false
      KIN_DOWNSTREAM_DISPATCH_TOKEN:
        required: false
      KIN_RELEASE_TAG_TOKEN:
        # Fallback when no App credentials are supplied. Needs contents:write on
        # the calling repo. A tag pushed with the default GITHUB_TOKEN cannot
        # start release.yml, so mint-release-tag refuses rather than consume the
        # version with a tag that releases nothing.
        required: false
      KIN_RELEASE_BOT_APP_ID:
        # Preferred over a PAT: an App installation token is short-lived, scoped
        # to this repo for the run, and does start release.yml. Same App the kin
        # release flow already mints tags with.
        required: false
      KIN_RELEASE_BOT_PRIVATE_KEY:
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  KINLAB_CARGO_REGISTRY_URL: https://kinlab.ai

jobs:
  version_gate:
    name: Version bump gate
    runs-on: ubuntu-latest
    outputs:
      release_candidate: ${{ steps.version_policy.outputs.release_candidate }}
      release_needed: ${{ steps.version_policy.outputs.release_needed }}
      release_intent: ${{ steps.version_policy.outputs.release_intent }}
      trusted_train_pr: ${{ steps.version_policy.outputs.trusted_train_pr }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .kin-actions
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          # Tolerated for the reason upstream tolerated it: on a runner whose rustup
          # already carries a default, re-defaulting can fail while the toolchain is
          # installed and usable.
          rustup default 1.96.0 || true
          echo "CARGO_INCREMENTAL=${CARGO_INCREMENTAL:-0}" >> "$GITHUB_ENV"
          echo "CARGO_TERM_COLOR=${CARGO_TERM_COLOR:-always}" >> "$GITHUB_ENV"
      - name: Check version movement
        id: version_policy
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          # A single push can contain a version bump followed by non-release
          # commits. Compare the pushed range, not just HEAD^, or the trailing
          # commit can hide the release candidate.
          PUSH_BEFORE: ${{ github.event_name == 'push' && github.ref_type == 'branch' && github.event.before || '' }}
          # Untrusted PR labels are passed via env (never interpolated into the
          # shell) and forwarded to the gate as a single quoted argv value. A
          # `release` / `release:*` label forces the bump requirement.
          PR_LABELS: ${{ github.event_name == 'pull_request' && join(github.event.pull_request.labels.*.name, ',') || '' }}
          SOURCE_PATHS: ${{ inputs.source-paths }}
          VERSION_MODE: ${{ inputs.version-mode }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BASE_REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          HEAD_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          TRAIN_BRANCH: ${{ inputs.train-branch }}
        run: |
          set -euo pipefail
          args=()
          for p in $SOURCE_PATHS; do args+=(--source-path "$p"); done
          generated_args=()
          if [[ "$VERSION_MODE" == "train" ]]; then
            inspection="$(
              python3 .kin-actions/scripts/prepare-cargo-release.py \
                --inspect --manifest "${{ inputs.manifest }}"
            )"
            mapfile -t generated_paths < <(jq -r '.allowed_paths[]' <<<"$inspection")
            for path in "${generated_paths[@]}"; do
              generated_args+=(--generated-path "$path")
            done
          fi
          python3 .kin-actions/scripts/check-version-bump.py \
            --package "${{ inputs.package }}" \
            --manifest "${{ inputs.manifest }}" \
            --version-mode "$VERSION_MODE" \
            --event-name "$EVENT_NAME" \
            --ref-type "$REF_TYPE" \
            --ref-name "$REF_NAME" \
            --default-branch "$DEFAULT_BRANCH" \
            --base-repo "$BASE_REPOSITORY" \
            --head-repo "$HEAD_REPOSITORY" \
            --head-branch "$HEAD_BRANCH" \
            --train-branch "$TRAIN_BRANCH" \
            --labels "$PR_LABELS" \
            "${generated_args[@]}" \
            "${args[@]}"

  registry_smoke:
    name: Registry-only build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .kin-actions
      - name: Restore bounded cargo source cache
        id: cargo_source_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-source-v2-${{ runner.os }}-${{ runner.arch }}
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          # Tolerated for the reason upstream tolerated it: on a runner whose rustup
          # already carries a default, re-defaulting can fail while the toolchain is
          # installed and usable.
          rustup default 1.96.0 || true
          echo "CARGO_INCREMENTAL=${CARGO_INCREMENTAL:-0}" >> "$GITHUB_ENV"
          echo "CARGO_TERM_COLOR=${CARGO_TERM_COLOR:-always}" >> "$GITHUB_ENV"
      - name: Force registry-only Kin config
        run: |
          set -euo pipefail
          if [[ -L .cargo || -L .cargo/config.toml ]]; then
            echo "Cargo config path must not be a symlink" >&2
            exit 1
          fi
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [registries.kin]
          index = "sparse+https://kinlab.ai/registry/cargo/"
          EOF
      - name: Fetch complete cargo source graph
        id: cargo_source_fetch
        env:
          MANIFEST: ${{ inputs.manifest }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/kin-actions-target
        run: |
          set -euo pipefail
          if [[ ! -f "$MANIFEST" || -L "$MANIFEST" ]]; then
            echo "Cargo manifest must be a regular non-symlink file" >&2
            exit 1
          fi
          workspace_root="$(realpath "$GITHUB_WORKSPACE")"
          manifest_path="$(realpath "$MANIFEST")"
          case "$manifest_path" in
            "$workspace_root"/*) ;;
            *) echo "Cargo manifest escapes the checked-out workspace" >&2; exit 1 ;;
          esac
          workspace_manifest="$(
            cargo locate-project --workspace --message-format plain \
              --manifest-path "$MANIFEST"
          )"
          case "$(realpath "$workspace_manifest")" in
            "$workspace_root"/*) ;;
            *) echo "Cargo workspace manifest escapes the checkout" >&2; exit 1 ;;
          esac
          fetch_args=(fetch --manifest-path "$MANIFEST")
          if [[ -f "${workspace_manifest%/*}/Cargo.lock" ]]; then
            fetch_args+=(--locked)
          fi
          cargo "${fetch_args[@]}"
      - name: Save bounded cargo source cache from main
        if: success() && steps.cargo_source_fetch.outcome == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo_source_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.cargo_source_cache.outputs.cache-primary-key }}
      - name: Build without local patches
        env:
          PACKAGE: ${{ inputs.package }}
          MANIFEST: ${{ inputs.manifest }}
          REGISTRY_BUILD_COMMAND: ${{ inputs.registry-build-command }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/kin-actions-target
        run: python3 .kin-actions/scripts/run-registry-build.py

  test:
    name: Repo verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Restore bounded cargo source cache
        id: cargo_source_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-source-v2-${{ runner.os }}-${{ runner.arch }}
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          # Tolerated for the reason upstream tolerated it: on a runner whose rustup
          # already carries a default, re-defaulting can fail while the toolchain is
          # installed and usable.
          rustup default 1.96.0 || true
          echo "CARGO_INCREMENTAL=${CARGO_INCREMENTAL:-0}" >> "$GITHUB_ENV"
          echo "CARGO_TERM_COLOR=${CARGO_TERM_COLOR:-always}" >> "$GITHUB_ENV"
      - name: Run verification
        run: ${{ inputs.test-command }}

  publish:
    name: Publish to Kin registry
    needs: [version_gate, registry_smoke, test]
    # Only a main commit that moves the package version owns that release.
    # Ordinary docs/tests/CI-only main pushes and every tag push must not
    # re-enter registry publication at an already-consumed version.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.version_gate.outputs.release_candidate == 'true'
    runs-on: ubuntu-latest
    environment: ${{ inputs.publish-environment }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .kin-actions
      - name: Restore bounded cargo source cache
        id: cargo_source_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-source-v2-${{ runner.os }}-${{ runner.arch }}
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          # Tolerated for the reason upstream tolerated it: on a runner whose rustup
          # already carries a default, re-defaulting can fail while the toolchain is
          # installed and usable.
          rustup default 1.96.0 || true
          echo "CARGO_INCREMENTAL=${CARGO_INCREMENTAL:-0}" >> "$GITHUB_ENV"
          echo "CARGO_TERM_COLOR=${CARGO_TERM_COLOR:-always}" >> "$GITHUB_ENV"
      - name: Resolve version
        id: version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; p="${{ inputs.package }}"; print(next(x["version"] for x in json.load(sys.stdin)["packages"] if x["name"] == p))')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publish
        env:
          PACKAGE: ${{ inputs.package }}
          KINLAB_CARGO_TOKEN: ${{ secrets.KINLAB_CARGO_TOKEN }}
        run: bash .kin-actions/scripts/publish-crate.sh

  consumer_smoke:
    name: Fresh consumer smoke
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .kin-actions
      - name: Restore bounded cargo source cache
        id: cargo_source_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-source-v2-${{ runner.os }}-${{ runner.arch }}
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          # Tolerated for the reason upstream tolerated it: on a runner whose rustup
          # already carries a default, re-defaulting can fail while the toolchain is
          # installed and usable.
          rustup default 1.96.0 || true
          echo "CARGO_INCREMENTAL=${CARGO_INCREMENTAL:-0}" >> "$GITHUB_ENV"
          echo "CARGO_TERM_COLOR=${CARGO_TERM_COLOR:-always}" >> "$GITHUB_ENV"
      - name: Build exact published version from registry
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: bash .kin-actions/scripts/consumer-smoke.sh

  mint_release_tag:
    name: Mint release tag
    needs: [publish, consumer_smoke]
    # Main pushes only. Gating off a tag push matters: this job's own tag would
    # re-enter this workflow, and it must not tag a tag.
    if: inputs.mint-release-tag && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Bind every credential-bearing release stage to the same caller-selected
    # environment. Environment secrets with matching names take precedence over
    # secrets mapped by the caller, so repositories can migrate without an
    # outage: populate the environment first, prove a run, then remove the
    # compatibility copies from repository/org scope.
    environment: ${{ inputs.publish-environment }}
    outputs:
      release_tag_status: ${{ steps.mint.outputs.release_tag_status }}
    env:
      # The `secrets` context is not available in an `if:` condition, so presence
      # is resolved here into `env`, which `if:` can read. Interpolating secrets
      # directly into a step `if:` makes GitHub reject the whole workflow file.
      HAVE_APP_CREDS: ${{ secrets.KIN_RELEASE_BOT_APP_ID != '' && secrets.KIN_RELEASE_BOT_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          # checkout otherwise stores the job's GITHUB_TOKEN as an
          # `http.https://github.com/.extraheader` AUTHORIZATION header, and that
          # header wins over the credential in an explicit push URL. This workflow
          # declares `contents: read`, so the push would authenticate as a
          # read-only token and be rejected no matter which App token was minted.
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .kin-actions
          persist-credentials: false
      - name: Mint an App installation token
        id: app_token
        if: env.HAVE_APP_CREDS == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.KIN_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.KIN_RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
      - name: Mint v<version> when absent
        id: mint
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          # App token first: short-lived and correctly scoped. The PAT chain is
          # the fallback for repos with no App credentials. KIN_DOWNSTREAM_DISPATCH_TOKEN
          # is deliberately NOT consulted: it carries repository_dispatch only,
          # and a push with it fails, which reads as a broken release rather than
          # a missing credential.
          KIN_RELEASE_TAG_TOKEN: ${{ steps.app_token.outputs.token || secrets.KIN_RELEASE_TAG_TOKEN }}
          KIN_CI_BOT_TOKEN: ${{ secrets.KIN_CI_BOT_TOKEN }}
        run: bash .kin-actions/scripts/mint-release-tag.sh

  dispatch_downstreams:
    name: Notify downstream repos
    needs: [publish, consumer_smoke, mint_release_tag]
    # Wait for the optional tag stage so a dispatch-only failure is reported
    # after the durable publish/tag state is known. `always()` is required
    # because mint_release_tag is intentionally skipped by callers that keep
    # their own tag authority.
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.publish.result == 'success' &&
      needs.consumer_smoke.result == 'success' &&
      (needs.mint_release_tag.result == 'success' ||
       needs.mint_release_tag.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ inputs.publish-environment }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .kin-actions
      - name: Dispatch dependency wave
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ needs.publish.outputs.version }}
          DOWNSTREAM_MANIFEST: ${{ inputs.downstream-manifest }}
          RELEASE_TAG_STATUS: ${{ needs.mint_release_tag.outputs.release_tag_status || 'not-requested' }}
          KIN_CI_BOT_TOKEN: ${{ secrets.KIN_CI_BOT_TOKEN }}
          KIN_DOWNSTREAM_DISPATCH_TOKEN: ${{ secrets.KIN_DOWNSTREAM_DISPATCH_TOKEN }}
        run: |
          if ! bash .kin-actions/scripts/dispatch-downstreams.sh; then
            echo "::error title=Downstream notification failed::Registry publication and the fresh-consumer proof are already complete; release-tag status is '${RELEASE_TAG_STATUS}'. Rerun only the failed dispatch job."
            exit 1
          fi
